<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>Ushering Chapter 1</title>
<meta name="description" content="A short conversation game. Customers walk in one at a time and stop in front of you; pick the right reply from four. Every answer shows a line from Ushering Chapter 1.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- the font loads without blocking: if Google Fonts hangs, the game still starts with the system font -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"></noscript>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#5B4BDB;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#0F0A6C;-webkit-font-smoothing:antialiased}
#app{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,#6F60EA 0%,#5B4BDB 48%,#4A3CC8 100%)}
#app:before,#app:after{content:"";position:absolute;border-radius:50%;background:#fff;opacity:.05;pointer-events:none}
#app:before{width:46vmax;height:46vmax;left:-14vmax;bottom:-18vmax}
#app:after{width:30vmax;height:30vmax;right:-10vmax;top:-8vmax}
#game{position:absolute;z-index:1;left:0;top:0;width:320px;height:400px;overflow:hidden;transform-origin:0 0;background:#fff;color:#0F0A6C}
#game.boxed{border-radius:22px;box-shadow:0 18px 50px rgba(15,10,60,.45)}
#game:focus{outline:none}
#game svg{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:none;
  -webkit-tap-highlight-color:transparent;text-align:inherit}
button:focus{outline:none}
button:focus-visible{outline:3px solid #0F0A6C;outline-offset:2px;box-shadow:0 0 0 6px #fff}
button[disabled]{cursor:default}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.bar{position:absolute;left:0;top:0;right:0;height:38px;background:#5B4BDB;color:#fff;display:flex;align-items:center;gap:7px;padding:0 9px 0 13px;z-index:30}
.bar .ttl{font-size:13.5px;font-weight:600;white-space:nowrap;letter-spacing:-.005em}
.bulb{margin-left:auto;position:relative;flex:none;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;transition:background .3s,box-shadow .3s}
.bulb svg{position:relative}
.bulb .bf{fill:#fff;transition:fill .3s}
.bulb .ring{position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:conic-gradient(#FFD84D var(--p,0%),transparent 0);
  -webkit-mask:radial-gradient(circle,transparent 10px,#000 10.5px);mask:radial-gradient(circle,transparent 10px,#000 10.5px)}
.bulb.lit{background:#FFF1B3;box-shadow:0 0 0 3px rgba(255,216,77,.45),0 0 14px rgba(255,216,77,.95)}
.bulb.lit .bf{fill:#FFD84D}
.bulb.lit .ring{display:none}
.chip{background:rgba(255,255,255,.2);border-radius:10px;padding:4px 9px;font-size:11.5px;font-weight:600;white-space:nowrap;flex:none}
.xbtn{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;position:relative}
.xbtn::before{content:"";position:absolute;left:-17px;right:-6px;top:-6px;bottom:-17px}   /* a 49 px hit area: 44 px or more on screen at 300 x 360 */
.xbtn:focus-visible{outline:3px solid #fff;outline-offset:1px;box-shadow:none}
#game.withclose .bar{gap:6px;padding:0 6px 0 11px}
#game.withclose .ttl{font-size:12.4px}
#game.withclose .chip{font-size:10.6px;padding:4px 7px}

/* ---------- the store ---------- */
.scene{position:absolute;left:0;top:38px;width:320px;height:168px;overflow:hidden}
.scene .bg{position:absolute;left:0;top:0}
.shelf{position:absolute;left:56px;top:70px;width:104px;height:52px;display:none}
.cast{position:absolute;left:0;top:0;width:320px;height:168px}
.cw{position:absolute;left:0;top:0;transform-origin:0 0;display:none;will-change:transform}
.cw svg{width:100%;height:100%;overflow:visible}
.cw .m-sm,.cw .m-tk,.cw .m-fl,.cw .m-o,.cw .sweat,.cw .shut,.cw .emph{display:none}
.hearts{position:absolute;left:0;top:0;width:320px;height:168px;pointer-events:none;z-index:2}
.hearts i{position:absolute;width:15px;height:14px;font-style:normal}
.hearts svg{width:15px;height:14px}
.bub{position:absolute;background:#fff;border-radius:14px;padding:8px 11px;font-size:13px;line-height:1.32;font-weight:600;box-shadow:0 4px 12px rgba(15,10,108,.16);z-index:3;
  transform-origin:0 30%;visibility:hidden}
.bub::before{content:"";position:absolute;left:-7px;top:16px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.sbub{position:absolute;display:flex;gap:5px;align-items:center;padding:12px 14px;border:2px dashed #B9AFEF;border-radius:14px;background:#fff;z-index:3;visibility:hidden;transform-origin:0 50%}
.sbub i{width:8px;height:8px;border-radius:50%;background:#9C93E6}
.cue{position:absolute;left:8px;top:27px;max-width:304px;display:flex;align-items:center;gap:5px;padding:3px 9px 3px 6px;border-radius:10px;background:#3A2FA8;color:#fff;
  font-size:10.4px;line-height:1.25;font-weight:600;z-index:4;box-shadow:0 3px 8px rgba(15,10,108,.22);visibility:hidden}
.cue svg{flex:none}
.hint{position:absolute;left:10px;right:10px;bottom:7px;display:flex;align-items:center;gap:7px;background:#FFF4CC;border:1.5px solid #F0CF6B;border-radius:12px;padding:6px 10px;
  font-size:11.6px;line-height:1.3;font-weight:600;box-shadow:0 4px 12px rgba(15,10,108,.14);z-index:5;visibility:hidden}
.hint svg{flex:none}
.hint .hx{flex:1;min-width:0}
.hint .x2{display:block;margin-top:2px;font-size:10.2px;line-height:1.28;font-weight:500;color:#3A2FA8}
.hint.silent.dbl{font-size:11.4px;padding:5px 9px}
.hint.tip{background:#fff;border-color:#B9AFEF}
.hint.silent{font-size:12.2px;padding:7px 10px}
.hint.slow{background:none;border:0;box-shadow:none;padding:0}
.hint.slow .q{flex:1;box-shadow:0 4px 12px rgba(15,10,108,.18)}
.hint.pop{animation:hpop .32s cubic-bezier(.2,.9,.3,1.2)}
@keyframes hpop{from{transform:translateY(6px) scale(.97);opacity:0}to{transform:none;opacity:1}}

/* ---------- replies ---------- */
.opts{position:absolute;left:10px;top:212px;width:300px;height:180px;z-index:6}
.op{position:absolute;left:0;top:0;width:300px;height:40.5px;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #DCD6FF;border-radius:12px;
  padding:0 9px 0 7px;font-size:11.8px;line-height:1.28;font-weight:500;box-shadow:0 1.5px 0 #E6E1FF;text-align:left;color:#0F0A6C;opacity:0;visibility:hidden;
  transition:top .38s cubic-bezier(.2,.8,.2,1),height .38s cubic-bezier(.2,.8,.2,1),transform .34s cubic-bezier(.3,.7,.2,1),opacity .3s,background-color .2s,border-color .2s,box-shadow .25s}
.op .ic{flex:none;width:26px;height:26px;border-radius:8px;background:#F1EEFF;display:grid;place-items:center}
.op .tx{flex:1;min-width:0}
.op .mk{flex:none;display:none}
.op.in{opacity:1;visibility:visible}
.op:not([disabled]):hover{border-color:#B9AFEF}
.op.out{opacity:.22}
.op.out .tx{text-decoration:line-through}
.op.dim{opacity:.36}
.op.glow{padding-right:42px;border-color:#2FD39A;background:#EFFFF8;box-shadow:0 0 0 3px rgba(65,231,171,.5),0 0 18px 2px rgba(65,231,171,.65);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px rgba(65,231,171,.62),0 0 22px 4px rgba(65,231,171,.8)}}
.op.bad{border-color:#E5484D;background:#FFF1F1;opacity:1}
.op.good{border-color:#1FA971;background:#EBFAF3;opacity:1;animation:none}
.op.bad .mk,.op.good .mk{display:block}
.op.gone{opacity:0;pointer-events:none}
.op.glow:not(.good) .tx,.op.bad .tx,.op.good .tx{font-weight:500}
.fbq{position:absolute;left:0;top:0;width:300px;opacity:0;visibility:hidden;transition:top .38s cubic-bezier(.2,.8,.2,1),opacity .3s}
.fbq.in{opacity:1;visibility:visible}
.q{background:#fff;border-left:4px solid #5B4BDB;border-radius:10px;padding:6px 10px 7px;font-size:12px;line-height:1.32;font-weight:600}
.q small{display:block;font-size:9.2px;letter-spacing:.04em;font-weight:700;text-transform:uppercase;margin-bottom:1px}
.q.ok{border-left-color:#1FA971}
.q.ok small{color:#13804F}
.q.no{border-left-color:#E5484D;background:#FFF6F6}
.q.no small{color:#C0353A}
.fbq .q{border:1px solid #ECE9FF;border-left-width:4px}
.caret{display:inline-block;width:2px;height:13px;background:#0F0A6C;vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ghost{color:transparent}
.note{position:absolute;left:0;top:0;width:300px;text-align:center;font-size:11px;font-weight:600;color:#5B4BDB;opacity:0;visibility:hidden;transition:top .38s,opacity .3s}
.note.in{opacity:1;visibility:visible}
.row{position:absolute;left:0;bottom:0;width:300px;display:flex;align-items:center;justify-content:space-between;opacity:0;visibility:hidden;transition:opacity .3s}
.row.in{opacity:1;visibility:visible}
.pts{background:#DDFBEF;color:#13804F;border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:600}
.btn{display:block;background:#5B4BDB;color:#fff;border-radius:12px;padding:0 16px;height:40px;font-size:13px;font-weight:600;text-align:center;box-shadow:0 3px 0 #3A2FA8;
  transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #3A2FA8}
.btn.ghost{background:#fff;color:#5B4BDB;border:1.5px solid #C9C1F5;box-shadow:none}
.btn.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 3px 0 #3A2FA8}50%{transform:scale(1.06);box-shadow:0 3px 0 #3A2FA8,0 0 0 6px rgba(91,75,219,.25)}}
#nextBtn{min-width:132px}
.handat{position:absolute;left:0;top:0;width:30px;height:38px;z-index:26;pointer-events:none;display:none}
.handat svg{filter:drop-shadow(0 2px 3px rgba(15,10,108,.35))}
.tapit{position:absolute;right:14px;top:0;background:#0F0A6C;color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:600;z-index:26;pointer-events:none;
  opacity:0;visibility:hidden;transition:opacity .25s}
.tapit.in{opacity:1;visibility:visible}
.tapit.nudge,.note.nudge{animation:nudge .5s ease-in-out}
@keyframes nudge{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* ---------- practice card ---------- */
.coach{position:absolute;left:10px;top:212px;width:300px;height:180px;background:#fff;border:1.5px solid #DCD6FF;border-radius:14px;padding:11px 14px 12px;display:flex;flex-direction:column;z-index:8;
  opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1)}
.coach.in{opacity:1;visibility:visible;transform:none}
.coach small{font-size:9.5px;font-weight:700;letter-spacing:.06em;color:#5B4BDB}
.coach p{margin:6px 0 0;font-size:12px;line-height:1.38;font-weight:500}
.coach .soft{color:#5B4BDB;font-weight:600}
.coach .btn{margin-top:auto;width:100%}

/* ---------- start ---------- */
.start{position:absolute;left:0;top:0;width:320px;height:400px;padding:16px 18px;color:#fff;background:linear-gradient(165deg,#6E5FEE,#3A2FA8);z-index:40;
  transition:opacity .35s,transform .4s cubic-bezier(.2,.8,.2,1)}
.start .xs{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:rgba(15,10,108,.5);display:grid;place-items:center;z-index:2}
.start .xs::before{content:"";position:absolute;left:-17px;right:-6px;top:-6px;bottom:-17px}
.start .xs:focus-visible{outline:3px solid #fff;outline-offset:1px;box-shadow:none}
.start.off{opacity:0;transform:translateY(-12px);pointer-events:none}
.start .door{width:284px;height:50px;overflow:hidden;border-radius:12px;margin-bottom:12px;position:relative}
.start .door svg{position:absolute;left:-36px;top:-34px}
.start h1{font-size:23px;white-space:nowrap;line-height:1.1;margin:0 0 10px;font-weight:700}
.usher{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.26);border-radius:12px;padding:8px 11px}
.usher b{font-size:12px;letter-spacing:.1em}
.usher span{font-size:11px;opacity:.85}
.usher p{margin:3px 0 0;font-size:11.2px;line-height:1.4}
.motto{margin:10px 0 2px;font-size:13px;font-weight:600;color:#41E7AB}
.meta{margin:0;font-size:10.6px;opacity:.9}
.cta{position:absolute;left:18px;right:18px;bottom:16px;height:44px;background:#41E7AB;color:#0F0A6C;border-radius:14px;text-align:center;font-size:15px;font-weight:700;box-shadow:0 3px 0 #1B7A74}
.cta:active{transform:translateY(2px);box-shadow:0 1px 0 #1B7A74}
.start button:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 6px #0F0A6C}

/* ---------- cleared + confetti + end card ---------- */
.veil{position:absolute;left:0;top:38px;width:320px;height:362px;background:rgba(238,235,255,.72);z-index:42;opacity:0;visibility:hidden;transition:opacity .35s}
.veil.in{opacity:1;visibility:visible}
.clr{position:absolute;left:24px;top:118px;width:272px;padding:22px 18px 20px;background:#fff;border-radius:20px;text-align:center;z-index:48;
  box-shadow:0 18px 40px rgba(15,10,108,.25),0 0 0 1.5px #DCD6FF;opacity:0;visibility:hidden;transform:scale(.7);transition:opacity .3s,transform .45s cubic-bezier(.2,1.3,.4,1)}
.clr.in{opacity:1;visibility:visible;transform:none}
.clr .cb{width:54px;height:54px;margin:-50px auto 10px;border-radius:50%;background:#41E7AB;display:grid;place-items:center;box-shadow:0 0 0 5px #fff,0 6px 16px rgba(15,10,108,.25)}
.clr p{font-size:20px;line-height:1.28;font-weight:700;color:#0F0A6C;letter-spacing:-.01em;text-wrap:balance}
#conf{position:absolute;left:0;top:0;width:320px;height:400px;z-index:47;pointer-events:none;display:none}   /* over the end card, under the cleared card */
.end{position:absolute;left:0;top:38px;width:320px;height:362px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px;background:#fff;z-index:45;
  transform:translateY(102%);visibility:hidden;transition:transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s .5s}
.end.in{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.ehead{padding:4px 8px 0}
.ehead .cb{display:inline-grid;vertical-align:-5px;margin-right:6px;width:22px;height:22px;border-radius:50%;background:#41E7AB;place-items:center}
.ehead p{font-size:14px;line-height:1.3;font-weight:700;text-align:center;text-wrap:balance}
.score{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:2px}
.score b{font-size:52px;line-height:1;font-weight:700;letter-spacing:-.02em}
.score b small{font-size:22px}
.stars{display:flex;gap:2px}
.tier{margin:0;text-align:center;font-size:14px;font-weight:600}
.chips{display:flex;justify-content:center;gap:8px}
.chips span{background:#EEEBFF;border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:600}
.rem{border:1.5px solid #DCD6FF;border-radius:12px;padding:8px 12px}
.rem small{display:block;font-size:9.4px;font-weight:700;letter-spacing:.05em;color:#5B4BDB}
.rem div{font-size:13px;line-height:1.35;font-weight:600;margin-top:2px}
.need{margin:0;text-align:center;font-size:11.5px;font-weight:600;color:#7A4A00;background:#FFF4CC;border-radius:10px;padding:6px 10px;display:none}
.two{display:grid;grid-template-columns:1fr 1.3fr;gap:9px;margin-top:auto}
.two.solo{grid-template-columns:1fr}
.two .btn{height:42px}

@media (prefers-reduced-motion: reduce){
  .op,.fbq,.note,.coach,.start,.end,.end.in,.clr,.veil,.tapit,.btn{transition:opacity .3s,visibility 0s !important;animation:none !important}
  .op.glow{animation:none}
  .clr{transform:none}
  .end{transform:none;opacity:0}
  .end.in{opacity:1}
  .start.off{transform:none}
  .coach{transform:none}
  .hint.pop,.caret{animation:none}
  /* no movement, but the cues stay: Next customer and the nudges change colour instead */
  .btn.pulse{animation:pulsec 1.4s ease-in-out infinite !important}
  .tapit.nudge{animation:nudgec .6s ease-in-out !important}
  .note.nudge{animation:nudgen .6s ease-in-out !important}
}
@keyframes pulsec{0%,100%{background:#5B4BDB;box-shadow:0 3px 0 #3A2FA8,0 0 0 5px rgba(91,75,219,0)}50%{background:#3A2FA8;box-shadow:0 3px 0 #3A2FA8,0 0 0 5px rgba(91,75,219,.38)}}
@keyframes nudgec{50%{background:#5B4BDB}}
@keyframes nudgen{50%{color:#0F0A6C}}
</style>
</head>
<body>
<div id="app"><div id="game" role="region" aria-label="Ushering Chapter 1">
  <div class="bar" id="bar"><span class="ttl" id="ttl"></span><span class="bulb" id="bulb" aria-hidden="true"><i class="ring"></i></span><span class="chip" id="chip"></span></div>
  <div class="scene" id="scene"><div class="shelf" id="shelf"></div><div class="cast" id="cast"></div><div class="hearts" id="hearts"></div>
    <div class="bub" id="bub"></div><div class="sbub" id="sbub" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="cue" id="cue"></div><div class="hint" id="hint"></div></div>
  <div class="opts" id="opts"></div>
  <div class="coach" id="coach"></div>
  <div class="handat" id="hand"></div><div class="tapit" id="tapit"></div>
  <section class="start" id="start"></section>
  <div class="veil" id="veil"></div><div class="clr" id="clr"></div>
  <section class="end" id="end" aria-label="Round result"></section>
  <canvas id="conf" aria-hidden="true"></canvas>
</div></div>
<div id="live" class="sr" aria-live="polite" aria-atomic="true"></div>
<script>
(function () {
'use strict';

/* =====================================================================
   CONTENT  (approved questionnaire, word for word: content.json)
   ch1: the Chapter 1 lines with their pages. practice + customers A-I:
   talks, who, mission, scene (not shown), line (a speaking customer's words),
   silent (arrival hint for a silent customer), cue (scene line), options
   (kind, text, right, key, page, label, line), fade (the reply crossed out
   at 5 s, by its place in this list), nudge (the 5-second hint question).
   Never an exclamation mark.
   ===================================================================== */
var CONTENT = {
 "ch1": {
  "title": {
   "page": 1,
   "text": "USHERING · LEVEL 1 · CHAPTER 1"
  },
  "missions": {
   "page": 2,
   "text": "One door. Many shopping missions."
  },
  "assume": {
   "page": 2,
   "text": "Don't assume a customer came in looking for Ray-Ban Meta."
  },
  "ack": {
   "page": 3,
   "text": "Make the customer feel acknowledged"
  },
  "start": {
   "page": 3,
   "text": "Helping them get started"
  },
  "guide": {
   "page": 3,
   "text": "Guiding them towards the right support"
  },
  "unatt": {
   "page": 3,
   "text": "Ensuring they are not left unattended"
  },
  "begin": {
   "page": 3,
   "text": "Notice them. Welcome them. Help them begin."
  },
  "usher": {
   "page": 4,
   "text": "Rooted in a medieval term meaning “doorkeeper,” an usher welcomed people in and guided them to their seats in theatres."
  },
  "mind": {
   "page": 5,
   "text": "Customer first. Product later."
  },
  "say": {
   "page": 5,
   "text": "What would you like to explore today?"
  },
  "dontsay": {
   "page": 5,
   "text": "Would you like to see Ray-Ban Meta glasses?"
  },
  "welcome": {
   "page": 5,
   "text": "A good first interaction makes the customer feel welcome — not sold to."
  },
  "shout": {
   "page": 6,
   "text": "Shouting offers at customers"
  },
  "block": {
   "page": 7,
   "text": "Blocking the entrance"
  },
  "compete": {
   "page": 8,
   "text": "Competing aggressively with other promoters"
  },
  "pitch": {
   "page": 9,
   "text": "Immediately pitching Ray-Ban Meta"
  },
  "follow": {
   "page": 10,
   "text": "Following customers too closely"
  },
  "redirect": {
   "page": 11,
   "text": "Redirecting without ensuring someone assists them"
  },

    if (n !== D.typedN) {
      D.typedN = n; D.typed.textContent = all.slice(0, n).join(' ');
      D.ghost.textContent = n < all.length ? ' ' + all.slice(n).join(' ') : '';
      D.caret.style.display = n < all.length ? '' : 'none';
    }
  }
}

/* =====================================================================
   LOOP
   ===================================================================== */
function step(dt) {
  clock += dt;
  stepTweens();
  runTimers();
  tickHint(dt);
}
function frame(ts) {
  requestAnimationFrame(frame);
  if (paused || document.hidden) { lastTs = 0; return; }
  var dt = lastTs ? Math.min(.25, Math.max(0, (ts - lastTs) / 1000)) : 0;
  lastTs = ts;
  dt *= tScale;
  step(dt);
  render(dt);
  drawConfetti(dt);
}
/* jump through walk-ins, speech and slide-ins until the player has something to do (tests only) */
function fastForward() {
  var stopAt = { think: 1, done: 1, card: 1, end: 1, start: 1, lit: 1, wrong: 1, cleared: 1 };
  for (var guard = 0; guard < 400 && !stopAt[G.phase]; guard++) {
    var next = Infinity;
    timers.forEach(function (x) { if (x.t < next) next = x.t; });
    G.cast.forEach(function (r) { var w = r.st.walk; if (w && w.t0 + w.d > clock) next = Math.min(next, w.t0 + w.d); });
    if (next === Infinity) break;
    clock = Math.max(clock, next) + 1e-6;
    stepTweens(); runTimers();
    render(0);
  }
  finishTweens(); render(0);
}

/* =====================================================================
   LAYOUT  (scale the 320 x 400 canvas to fit any window, contain)
   ===================================================================== */
function layout() {
  var W = window.innerWidth || document.documentElement.clientWidth || 320, H = window.innerHeight || document.documentElement.clientHeight || 400;
  var s = Math.min(W / 320, H / 400);
  var x = (W - 320 * s) / 2, y = (H - 400 * s) / 2;
  game.style.transform = 'translate(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px) scale(' + s.toFixed(5) + ')';
  cls(game, 'boxed', x > 6 || y > 6);
  cScale = s; if (CONF.on) sizeCanvas();
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', function () { setTimeout(layout, 120); });

/* =====================================================================
   INPUT
   ===================================================================== */
var guardPushed = false;
var FRAMED = false; try { FRAMED = window.top !== window.self; } catch (e) { FRAMED = true; }
/* Back must not close a stand-alone pop-up. Inside the LMS gate (an iframe) the gate already makes Back harmless,
   so no history entry is added there (it would swallow the first Back press in the LMS). */
function firstGesture() {
  if (guardPushed || OPT.close || FRAMED) return; guardPushed = true;
  try { history.pushState({ uc: 1 }, ''); } catch (e) {}
}
window.addEventListener('popstate', function () { if (!OPT.close && guardPushed) { try { history.pushState({ uc: 1 }, ''); } catch (e) {} } });
function onBtn(el, fn) {
  el.addEventListener('click', function (e) { G.lastInput = e.detail === 0 ? 'key' : 'pointer'; firstGesture(); fn(e); });
}
onBtn(D.startBtn, onStart);
onBtn(D.gotIt, onGotIt);
D.ops.forEach(function (b, pos) { onBtn(b, function () { choose(pos); }); });
onBtn(D.next, onNext);
onBtn(D.again, onAgain);
onBtn(D.enter, onEnter);
if (D.cls) onBtn(D.cls, function () { post({ event: 'close' }); });
if (D.cls2) onBtn(D.cls2, function () { post({ event: 'close' }); });
/* a tap on the customer, the scene or empty space while the replies are up */
game.addEventListener('pointerdown', function (e) {
  G.lastInput = 'pointer'; firstGesture();
  var btn = e.target.closest && e.target.closest('button');
  if (btn) { if (btn.disabled && btn.classList.contains('op') && (G.phase === 'lit' || G.phase === 'wrong')) nudgePill(); return; }
  if (G.phase === 'replies' || G.phase === 'think') flashTapOne();
  else if (G.phase === 'lit' || G.phase === 'wrong') nudgePill();
  else if (G.phase === 'cleared' && clock - G.clearedT > .45) showEnd();
});
document.addEventListener('keydown', function (e) {
  var k = e.key;
  if (k === 'Escape' || k === 'Esc') { e.preventDefault(); return; }          /* mandatory: Esc never exits */
  if (k === 'Backspace') { e.preventDefault(); return; }
  if (k === 'Tab') { G.lastInput = 'key'; return; }
  if (/^[1-4]$/.test(k)) {
    G.lastInput = 'key';
    if (G.phase === 'replies' || G.phase === 'think' || G.phase === 'lit' || G.phase === 'wrong') { e.preventDefault(); if (!e.repeat) choose(+k - 1); }
    return;
  }
  if (k === 'Enter' || k === ' ' || k === 'Spacebar') {
    G.lastInput = 'key'; firstGesture();
    var a = document.activeElement;
    if (a && a.tagName === 'BUTTON' && !a.disabled && game.contains(a)) return;        /* the focused button clicks */
    e.preventDefault();
    if (e.repeat) return;
    if (G.phase === 'cleared' && clock - G.clearedT > .45) { showEnd(); return; }
    var list = tabbables(); if (list.length) focusEl(list[0]);
  }
});
function tabbables() {
  return Array.prototype.filter.call(game.querySelectorAll('button'), function (el) {
    if (el.disabled) return false;
    var r = el.getBoundingClientRect(); if (r.width < 1 || r.height < 1) return false;
    for (var p = el; p && p !== game; p = p.parentElement) { var cs = getComputedStyle(p); if (cs.display === 'none' || cs.visibility === 'hidden' || +cs.opacity < .05) return false; }
    return true;
  });
}
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('selectstart', function (e) { e.preventDefault(); });
document.addEventListener('dragstart', function (e) { e.preventDefault(); });
document.addEventListener('dblclick', function (e) { e.preventDefault(); });
document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
document.addEventListener('visibilitychange', function () { lastTs = 0; });
/* demo.html's focus loop: Tab past the last control (edge 'end') lands on the first one, Shift+Tab past the first (edge 'start') on the last */
window.addEventListener('message', function (e) {
  if (window.parent === window || e.source !== window.parent) return;
  var d = e.data; if (!d || typeof d !== 'object' || d.type !== 'ushering-ch1-focus') return;
  G.lastInput = 'key';
  var list = tabbables();
  if (!list.length) { parkFocus(); return; }
  focusEl(d.edge === 'start' ? list[list.length - 1] : list[0]);
});

/* =====================================================================
   TEST HOOKS  (UC_DEBUG)
   ===================================================================== */
function visibleText(el) { if (!el) return false; for (var p = el; p && p !== document.body; p = p.parentElement) { var cs = getComputedStyle(p); if (cs.display === 'none' || cs.visibility === 'hidden' || +cs.opacity < .05) return false; } return true; }
function wordsOnScreen() {
  var list = [];
  var els = game.querySelectorAll('.ttl,.chip,.bub,.cue,.hint,.op .tx,.fbq,.note,.row,.tapit,.coach small,.coach p,.coach .btn,.start h1,.usher,.motto,.meta,.cta,.clr p,.end p,.end b,.end span,.end small,.end div,.end .btn');
  Array.prototype.forEach.call(els, function (el) { if (visibleText(el)) { var s = (el.textContent || '').trim(); if (s) list.push(s); } });
  return { items: list, bang: list.some(function (s) { return s.indexOf('!') >= 0; }), solutions: list.some(function (s) { return /solutions/i.test(s); }) };
}
function rectOf(el) { if (!el) return null; var r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height, left: r.left, top: r.top }; }
window.UC_DEBUG = {
  state: function () {
    var c = T && T.c;
    return {
      scene: G.scene, phase: G.phase, round: G.round, practice: !!(T && T.practice), customer: c ? c.id : null, who: c ? c.who : null,
      index: G.practice ? 0 : G.idx + 1, of: G.list.length, roundIds: G.list.map(function (x) { return x.id; }),
      hintStage: T ? T.stage : 0, hintClock: T ? +T.hclock.toFixed(3) : 0, clockRunning: !!(T && T.running),
      faded: !!(T && T.stage >= 1), fadePos: T ? T.fadePos : -1, lit: !!(T && (G.phase === 'lit' || G.phase === 'wrong')), answered: !!(T && T.answered),
      result: T ? T.result : null, rightPos: T ? T.rightPos : -1, wrongPos: T ? T.wrongPos : -1, order: T ? T.order.slice() : null,
      replies: T ? T.order.map(function (oi) { return replyText(T.c.options[oi]); }) : [],
      right: G.results.filter(function (r) { return r.right; }).length, scored: G.results.length,
      scoreSoFar: G.results.length ? Math.round(G.results.filter(function (r) { return r.right; }).length / G.results.length * 100) : 0,
      hintsUsed: G.results.reduce(function (n, r) { return n + (r.hint ? 1 : 0) + (r.lit ? 1 : 0); }, 0),
      strip: stripText(), stripKind: G.flashUntil > clock ? 'tip' : (G.strip ? G.strip.kind : ''), bubble: BUB.s > .5 ? D.bub.textContent : (SB.s > .5 ? '…' : ''),
      cue: CUE.o > .5 ? D.cue.textContent : '', chip: D.chip.textContent, bulb: D.bulb.classList.contains('lit') ? 'lit' : 'idle',
      nextVisible: D.row.classList.contains('in'), nextPulse: D.next.classList.contains('pulse'), tapItVisible: D.tapit.classList.contains('in'),
      final: G.final, best: G.best, practiced: G.practiced, silentSeen: G.silentSeen, opts: OPT, clock: +clock.toFixed(3), reducedMotion: RM,
      cast: G.cast.map(function (r) { return { name: r.name, x: +r.st.x.toFixed(1), y: +r.st.y.toFixed(1), s: +r.st.s.toFixed(3), face: r.st.face, turn: +r.st.turn.toFixed(2), walking: !!r.st.walk }; }),
      focus: document.activeElement && document.activeElement !== document.body ? (document.activeElement.id || document.activeElement.className || document.activeElement.tagName) : null,
      messages: G.sent.length
    };
  },
  answer: function (i) { G.lastInput = 'pointer'; if (T) T.wrongT = -9; choose(+i); return this.state(); },
  answerRight: function () { if (!T) return this.state(); G.lastInput = 'pointer'; T.wrongT = -9; choose(T.rightPos); return this.state(); },
  answerWrong: function () {
    if (!T) return this.state(); G.lastInput = 'pointer';
    for (var p = 0; p < 4; p++) if (p !== T.rightPos && !D.ops[p].disabled) { choose(p); break; }
    return this.state();
  },
  skipWalk: function () { fastForward(); return this.state(); },
  advanceClock: function (sec) {
    sec = +sec || 0;
    if (T && T.running && !T.answered) { var n = Math.ceil(sec / .05); for (var i = 0; i < n; i++) tickHint(Math.min(.05, sec - i * .05)); }
    else if (T && G.phase === 'lit') T.litT -= sec;
    return this.state();
  },
  start: function () { onStart(); return this.state(); },
  gotIt: function () { D.gotArm = 0; onGotIt(); return this.state(); },
  next: function () { G.nextShownT = -9; onNext(); return this.state(); },
  skipConfetti: function () { G.clearedT = -9; showEnd(); return this.state(); },
  /* finish the round now: the customers not answered yet count as right (or pass n = how many of the whole round are right) */
  finishRound: function (n) {
    if (G.scene === 'start' || G.scene === 'card' || G.practice || (T && T.practice)) { if (!G.list.length || G.practice) { G.practice = false; G.round++; G.list = buildRound(); G.results = []; G.idx = 0; } }
    var done = G.results.length, total = G.list.length;
    var want = n == null ? null : Math.max(0, Math.min(total, +n));
    var have = G.results.filter(function (r) { return r.right; }).length;
    for (var i = done; i < total; i++) {
      var c = G.list[i], ok = want == null ? true : have < want;
      if (ok) have++;
      var wrongOpt = null; for (var j = 0; j < 4; j++) if (!c.options[j].right) { wrongOpt = c.options[j]; break; }
      G.results.push({ id: c.id, right: ok, hint: false, lit: false, miss: ok ? null : { label: wrongOpt.label, line: wrongOpt.line, page: wrongOpt.page, key: wrongOpt.key } });
    }
    timers = []; tweens = [];
    G.idx = total; T = null;
    cls(D.coach, 'in', false); D.start.style.display = 'none';
    roundOver();
    return this.state();
  },
  /* tests: start a round with these customers, e.g. forceRound(['H', 'I', 'G']) */
  forceRound: function (ids) {
    var C = CONTENT.customers;
    timers = []; tweens = []; T = null; hideCast();
    cls(D.coach, 'in', false); D.start.style.display = 'none'; cls(D.end, 'in', false); cls(D.veil, 'in', false); cls(D.clr, 'in', false); stopConfetti();
    G.round++; G.practice = false; G.results = []; G.final = null; G.roundCoach = false; G.idx = -1;
    G.list = ids.map(function (id) { for (var i = 0; i < C.length; i++) if (C[i].id === id) return C[i]; return null; }).filter(Boolean);
    nextInRound();
    return this.state();
  },
  sampleRound: function () { return buildRound().map(function (c) { return c.id; }); },
  resetStorage: function () { ['practiced', 'best', 'remIdx'].forEach(store.del); G.practiced = false; G.best = 0; },
  content: function () { return JSON.parse(JSON.stringify(CONTENT)); },
  speed: function (n) { if (n != null) tScale = Math.max(0, isNaN(+n) ? 1 : +n); return tScale; },
  pause: function (on) { paused = !!on; lastTs = 0; return paused; },
  rect: function (name) {
    if (/^op\d$/.test(name)) return rectOf(D.ops[+name.slice(2)]);
    var map = { game: game, start: D.startBtn, gotIt: D.gotIt, next: D.next, again: D.again, enter: D.enter, close: D.cls, scene: D.scene, bubble: D.bub, hint: D.hint, hand: D.hand, tapit: D.tapit, clr: D.clr, end: D.end, cue: D.cue, coach: D.coach, chip: D.chip };
    return rectOf(map[name]);
  },
  layoutCheck: function () {
    /* any reply text that does not fit its button, or feedback that runs past the bottom of the screen */
    var out = [];
    D.ops.forEach(function (b, i) { if (b.classList.contains('in') && !b.classList.contains('gone')) { var tx = b.querySelector('.tx'); if (tx.offsetHeight > parseFloat(b.style.height) - 4) out.push('op' + i + ' text ' + tx.offsetHeight + ' > ' + b.style.height); if (parseFloat(b.style.top) + parseFloat(b.style.height) > AREA_H + .5) out.push('op' + i + ' bottom ' + (parseFloat(b.style.top) + parseFloat(b.style.height))); } });
    [D.qNo, D.qOk, D.note].forEach(function (e, i) { if (e.classList.contains('in')) { var bt = parseFloat(e.style.top) + e.offsetHeight; if (bt > AREA_H + .5) out.push(['qNo', 'qOk', 'note'][i] + ' bottom ' + bt); } });
    if (D.qOk.classList.contains('in') && D.row.classList.contains('in')) { var qb = parseFloat(D.qOk.style.top) + D.qOk.offsetHeight; if (qb > AREA_H - 42) out.push('qOk overlaps row ' + qb); }
    var hr = D.hint.getBoundingClientRect(), sr2 = D.scene.getBoundingClientRect();
    if (D.hint.style.visibility === 'visible' && hr.top < sr2.top) out.push('hint taller than scene');
    var bar = D.bar.getBoundingClientRect(), ch = D.chip.getBoundingClientRect();
    if (ch.right > bar.right + .5) out.push('chip overflows bar');
    return out;
  },
  messages: G.sent,
  words: wordsOnScreen
};

/* =====================================================================
   BOOT
   ===================================================================== */
game.tabIndex = -1;
layout();
requestAnimationFrame(frame);
showStart();
})();
</script>
